[package]
name = "token-record"
version = "1.6.6"
description = "记录 Claude Code、Codex、Pi、Grok Build 的 token 与金钱消耗"
authors = ["hkm"]
edition = "2021"
default-run = "token-record"

[lib]
name = "token_record_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "token-record"
path = "src/main.rs"
required-features = ["gui"]

[[bin]]
name = "trcli"
path = "src/bin/cli.rs"

[features]
default = ["gui"]
gui = ["tauri", "tauri-plugin-updater"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"], optional = true }
tauri-plugin-updater = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }
dirs = "6"
csv = "1.3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
