<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Token 消耗记录</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="app">
      <!-- 标题栏：整条可拖动，按钮区排除拖动 -->
      <header class="titlebar">
        <div class="brand">
          <span class="brand-mark"></span>
          <span class="brand-text">Token 记录</span>
        </div>
        <div class="win-controls">
          <button id="btnMute" class="wc-btn" title="音效开关">🔊</button>
          <button id="btnPin" class="wc-btn" title="置顶开关">📌</button>
          <button id="btnRefresh" class="wc-btn" title="立即刷新">↻</button>
          <button id="btnMin" class="wc-btn" title="折叠/展开">▁</button>
          <button id="btnClose" class="wc-btn wc-close" title="退出">✕</button>
        </div>
      </header>

      <!-- 总览：三家合计 -->
      <section class="overview">
        <div class="ov-item">
          <span class="ov-num" id="grandTokens">0</span>
          <span class="ov-label">总 Tokens</span>
        </div>
        <div class="ov-divider"></div>
        <div class="ov-item">
          <span class="ov-num ov-cost" id="grandCost">$0</span>
          <span class="ov-label">总花费</span>
        </div>
      </section>

      <!-- 今日 / 近 7 日 + 迷你柱 -->
      <section class="period" id="period">
        <div class="period-stats">
          <div class="period-item">
            <span class="period-label">今日</span>
            <span class="period-val" id="periodToday">$0 · 0</span>
          </div>
          <div class="period-item">
            <span class="period-label">近 7 日</span>
            <span class="period-val" id="periodWeek">$0 · 0</span>
          </div>
        </div>
        <div class="period-bars" id="periodBars" title="近 7 日 token 用量"></div>
      </section>

      <!-- 全局空态 / 源异常提示（有数据时隐藏） -->
      <section class="empty-banner" id="emptyBanner" hidden>
        <div class="empty-title" id="emptyTitle">暂无用量数据</div>
        <div class="empty-body" id="emptyBody"></div>
      </section>

      <!-- 工具卡片容器：三张固定卡由脚本生成 -->
      <section class="cards" id="cards"></section>

      <!-- 状态栏 -->
      <footer class="statusbar">
        <span class="live-dot" id="liveDot"></span>
        <span id="updatedAt">等待数据…</span>
        <span class="spacer"></span>
        <span id="estimateNote"></span>
        <span id="appVersion" class="app-version" title="版本"></span>
      </footer>
    </div>

    <script src="animations.js"></script>
    <script src="sound.js"></script>
    <script src="app.js"></script>
  </body>
</html>
