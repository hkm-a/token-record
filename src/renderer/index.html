<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Token 消耗记录</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="app">
      <!-- 标题栏 -->
      <header class="titlebar" data-tauri-drag-region="deep">
        <div class="brand">
          <span class="brand-mark"></span>
          <span class="brand-text">Token 记录</span>
        </div>
        <div class="win-controls">
          <button id="btnMute" class="wc-btn" title="音效开关">🔊</button>
          <button id="btnPin" class="wc-btn" title="置顶开关">📌</button>
          <button id="btnRefresh" class="wc-btn" title="立即刷新">↻</button>
          <button id="btnMin" class="wc-btn" title="折叠/展开">▁</button>
          <button id="btnClose" class="wc-btn wc-close" title="隐藏到托盘">✕</button>
        </div>
      </header>

      <!-- 总览：合计 + 今日/7日副行（去掉原先两块大卡片） -->
      <section class="overview">
        <div class="ov-item">
          <span class="ov-num" id="grandTokens">0</span>
          <span class="ov-sub" id="grandTokensSub">今日 0 · 7日 0</span>
        </div>
        <div class="ov-divider"></div>
        <div class="ov-item">
          <span class="ov-num ov-cost" id="grandCost">$0</span>
          <span class="ov-sub" id="grandCostSub">今日 $0 · 7日 $0</span>
        </div>
      </section>

      <!-- 近 7 日迷你柱：一行高信息、低占位 -->
      <section class="spark" id="period">
        <span class="spark-label">7日</span>
        <div class="period-bars" id="periodBars" title="近 7 日 token 用量"></div>
      </section>

      <!-- 空态 -->
      <section class="empty-banner" id="emptyBanner" hidden>
        <div class="empty-title" id="emptyTitle">暂无用量数据</div>
        <div class="empty-body" id="emptyBody"></div>
      </section>

      <section class="cards" id="cards"></section>

      <footer class="statusbar">
        <span class="live-dot" id="liveDot"></span>
        <span id="updatedAt">等待数据…</span>
        <span class="spacer"></span>
        <span id="appVersion" class="app-version" title="版本"></span>
      </footer>
    </div>

    <script>
      // 非 Tauri 环境时提供空桩，使 app.js 能安全运行
      if (typeof window.__TAURI__ === 'undefined') {
        window.__TAURI__ = {
          core: { invoke: () => Promise.reject(new Error('not in Tauri')) },
          event: { listen: () => Promise.resolve(() => {}) },
          window: {
            getCurrentWindow: () => ({ hide(){}, setAlwaysOnTop(){}, setSize(){} }),
            LogicalSize: function (width, height) { this.width = width; this.height = height; },
          },
        };
      }
    </script>
    <script src="tauri-bridge.js"></script>
    <script src="animations.js"></script>
    <script src="sound.js"></script>
    <script src="app.js"></script>
  </body>
</html>
